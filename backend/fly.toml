# Fly.io config for the Cryptiq backend. Set `app` to your own name: fly launch --no-deploy --copy-config
app = "cryptiq-backend-CHANGE-ME"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "prod"
  DATA_DIR = "/data/data"
  ARTIFACTS_DIR = "/data/artifacts"
  DATABASE_URL = "sqlite:////data/cryptiq.sqlite"
  OFAC_LIST_PATH = "/data/data/labels/ofac_btc.txt"
  COOKIE_SAMESITE = "none"
  COOKIE_SECURE = "true"

[mounts]
  source = "cryptiq_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # a stopped machine means a cold start during the live demo
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
